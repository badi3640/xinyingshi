            `;

            const prevBtn = document.getElementById('btnPrevEpisode');
            const nextBtn = document.getElementById('btnNextEpisode');
            if (prevBtn) addTapListener(prevBtn, playPrevEpisode);
            if (nextBtn) addTapListener(nextBtn, playNextEpisode);

            renderAllServers(movie);
        }

        // 判断是否为可直接播放的媒体地址（m3u8/mp4 等），过滤掉第三方 iframe 播放器页面
        function isDirectMediaUrl(url) {
            if (!url) return false;
            try {
                const u = new URL(url, window.location.href);
                const pathname = u.pathname.toLowerCase();
                return /\.(m3u8|mp4|mkv|flv|ts|avi|mov|webm|3gp)(\?.*)?$/.test(pathname);
            } catch (e) {
                return false;
            }
        }

        function renderAllServers(movie) {
            const container = document.getElementById('allServers');

            if (!movie.vod_play_url) {
                container.innerHTML = '<div class="empty-state">暂无播放资源</div>';
                return;
            }

            const servers = movie.vod_play_url.split('$$$');
            const serverNames = movie.vod_play_from ? movie.vod_play_from.split('$$$') : [];

            const validServers = [];
            const seenNames = new Set();
            servers.forEach((serverUrls, index) => {
                const rawName = serverNames[index] || `线路${index + 1}`;
                const serverName = seenNames.has(rawName) ? `${rawName} (${index + 1})` : rawName;
                seenNames.add(rawName);
                const isBlocked = blockedServers.some(blocked =>
                    serverName.toLowerCase().includes(blocked.toLowerCase())
                );
                if (isBlocked || !serverUrls.trim()) return;

                const episodes = [];
                serverUrls.split('#').forEach((episode, i) => {
                    if (!episode.trim()) return;
                    const parsed = parseEpisode(episode, i);
                    if (parsed && parsed.url) {
                        episodes.push(parsed);
                    }
                });

                if (episodes.length > 0) {
                    validServers.push({
                        name: serverName,
                        urls: serverUrls,
                        episodes: episodes,
                        index: index
                    });
                }
            });

            // 只保留包含可直接播放地址的线路，过滤掉 iframe/第三方播放器页面
            const directServers = validServers.filter(s => s.episodes.some(ep => isDirectMediaUrl(ep.url)));
            // 前端只展示第一条可播放线路，后台仍保留其他线路用于自动切换
            const displayServers = directServers.length > 0 ? [directServers[0]] : [];

            movie._playServers = directServers.map(s => s.urls);
            movie._playServerNames = directServers.map(s => s.name);

            // 同步到缓存，方便下一集使用
            if (moviesCache[currentVodId]) {
                moviesCache[currentVodId]._playServers = movie._playServers;
                moviesCache[currentVodId]._playServerNames = movie._playServerNames;
            }

            if (displayServers.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无可直接播放的线路</div>';
                return;
            }

            container.innerHTML = displayServers.map((server) => `
                <div class="server-section">
                    <div class="server-header">
                        <div class="server-name">${escapeHtml(server.name)}</div>
                        <div class="server-actions"></div>
                    </div>
                    <ul class="play-list" style="display: flex;">
                        ${server.episodes.map((ep, epIndex) => {
                            const safeUrl = escapeHtml(ep.url);
                            const safeTitle = escapeHtml(ep.title);
                            const safeFullTitle = escapeHtml(ep.fullTitle);
                            return `
                            <li class="episode-item"
                                data-url="${safeUrl}"
                                data-server-index="0"
                                data-episode-index="${epIndex}"
                                data-title="${safeFullTitle}"
                                title="${safeFullTitle}">
                                <span>${safeTitle}</span>
                            </li>
                            `;
                        }).join('')}
                    </ul>
                </div>
            `).join('');

            // 使用 addEventListener 绑定线路折叠与剧集点击（含 touchstart）
            container.querySelectorAll('.server-header').forEach(header => {
                addTapListener(header, () => toggleServerSection(header));
            });
            container.querySelectorAll('.episode-item').forEach(item => {
                addTapListener(item, (e) => {
                    if (e && e.stopPropagation) e.stopPropagation();
                    const url = item.getAttribute('data-url');
                    const serverIndex = parseInt(item.getAttribute('data-server-index'), 10);
                    const epIndex = parseInt(item.getAttribute('data-episode-index'), 10);
                    if (url) playVideo(url, serverIndex, epIndex);
                });
            });

            // 自动播放第一集（只从可直接播放的线路里选）
            if (directServers.length > 0) {
                const firstServer = directServers[0];
                if (firstServer.episodes.length > 0) {
                    const firstEp = firstServer.episodes[0];
                    requestAnimationFrame(() => {
                        playVideo(firstEp.url, 0, 0);
                    });
                }
            }
        }

        function parseEpisode(episode, index) {
            let title = '';
            let url = '';

            const isUrl = (str) => {
                return str.startsWith('http://') || str.startsWith('https://')
                    || str.includes('.m3u8') || str.includes('.mp4')
                    || str.includes('.flv') || str.includes('.mkv');
            };

            // 只按第一个 $ 分割，避免 URL 中的 $ 破坏地址
            const separatorIndex = episode.indexOf('$');
            if (separatorIndex !== -1) {
                const first = episode.substring(0, separatorIndex).trim();
                const second = episode.substring(separatorIndex + 1).trim();

                if (isUrl(first)) {
                    url = first;
                    title = second || `第${index + 1}集`;
                } else if (isUrl(second)) {
                    url = second;
                    title = first || `第${index + 1}集`;
                } else {
                    url = second;
                    title = first || `第${index + 1}集`;
                }
            } else {
                const single = episode.trim();
                if (single.startsWith('http://') || single.startsWith('https://')
                    || single.includes('.m3u8') || single.includes('.mp4')) {
                    url = single;
                    title = `第${index + 1}集`;
                }
            }

            if (!url) return null;

            // 完整标题保留在 data-title/tooltip 中，显示交给 CSS 截断
            return { title, url, fullTitle: title };
        }

        function toggleServerSection(header) {
            const section = header.parentElement;
            const list = section.querySelector('.play-list');
            if (list) {
                list.style.display = list.style.display === 'none' ? 'flex' : 'none';
            }
        }

        function extractTsNumber(filename) {
            // 提取 .ts 前面数字串的最后 6 位作为片段序号；兼容 ?token=xxx 后缀
            const match = filename.match(/(\d+)\.ts(?:\?|$)/i);
            if (!match) return null;
            const suffix = match[1].slice(-6);
            return parseInt(suffix, 10);
        }

        function resolveUrl(base, relative) {
            if (!relative) return '';
            if (/^https?:\/\//i.test(relative)) return relative;
            return new URL(relative, base).href;
        }

        // 若 m3u8 经过 proxy.php 代理，需取原始地址用于计算 baseUrl
        function getOriginalM3u8Url(m3u8Url) {
            try {
                if (m3u8Url.includes('proxy.php?url=')) {
                    const urlObj = new URL(m3u8Url, window.location.href);
                    const original = urlObj.searchParams.get('url');
                    if (original) return decodeURIComponent(original);
                }
            } catch (e) {}
            return m3u8Url;
        }

        async function filterAdTsFromM3u8(m3u8Url, relativeThreshold = 10000) {
            try {
                console.log('[广告过滤] 开始过滤:', m3u8Url);
                const res = await fetch(getProxyUrl(m3u8Url));
                if (!res.ok) {
                    console.warn('[广告过滤] m3u8 请求失败:', res.status);
                    return m3u8Url;
                }
                let text = await res.text();
                console.log('[广告过滤] m3u8 长度:', text.length);

                const originalUrl = getOriginalM3u8Url(m3u8Url);
                let baseUrl = originalUrl.split('?')[0];
                if (!baseUrl.endsWith('/')) {
                    baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
                }
                console.log('[广告过滤] baseUrl:', baseUrl);

                // 如果当前 m3u8 本身走代理，则后续相对路径 ts 也应继续走代理
                const isProxyM3u8 = m3u8Url.includes('proxy.php?url=');
                function resolveTsUrl(line) {
                    if (/^https?:\/\//i.test(line)) return line;
                    const absoluteUrl = resolveUrl(baseUrl, line);
                    return isProxyM3u8 ? getProxyUrl(absoluteUrl) : absoluteUrl;
                }

                const lines = text.split('\n');

                // 多码率主 m3u8：递归过滤子清单
                if (text.includes('#EXT-X-STREAM-INF')) {
                    console.log('[广告过滤] 多码率主 m3u8，开始过滤子清单');
                    const filtered = [];
                    let changed = false;
                    let expectStreamUrl = false;

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];

                        if (line.startsWith('#EXT-X-STREAM-INF')) {
                            expectStreamUrl = true;
                            filtered.push(line);
                            continue;
                        }

                        if (expectStreamUrl && line.trim() && !line.startsWith('#')) {
                            expectStreamUrl = false;
                            const childUrl = resolveTsUrl(line);
                            const filteredChildUrl = await filterAdTsFromM3u8(childUrl, relativeThreshold);
                            if (filteredChildUrl !== childUrl) {
                                changed = true;
                                console.log('[广告过滤] 子清单已过滤:', childUrl, '->', filteredChildUrl);
                            }
                            filtered.push(filteredChildUrl);
                            continue;
                        }

                        filtered.push(line);
                    }

                    if (!changed) return m3u8Url;

                    const blob = new Blob([filtered.join('\n')], { type: 'application/x-mpegURL' });
                    const blobUrl = URL.createObjectURL(blob);
                    console.log('[广告过滤] 主清单过滤完成，返回 blob URL:', blobUrl);
                    return blobUrl;
                }

                // 普通媒体 m3u8：过滤广告分段（路径换源贴片 / 关键词 / 序号跳变）
                const AD_KEYWORDS = ['/ad/', '/ads/', 'advert', 'preroll', '/ad-', 'doubleclick', 'googleads', 'adserver', '/vast/', '/promo/', '/spot/', '_ad.', 'adbreak', '/adv/', '/adx/'];

                // 第一遍：收集所有 ts 分段及其目录、序号
                const tsEntries = [];
                let pendingExtinf = null;
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.startsWith('#EXTINF')) {
                        pendingExtinf = line;
                        continue;
                    }
                    if (/\.ts/i.test(line) && !line.startsWith('#')) {
                        const u = line.split('?')[0];
                        const dir = u.substring(0, u.lastIndexOf('/'));
                        tsEntries.push({ extinf: pendingExtinf, url: line, dir: dir, origIndex: i, isAd: false });
                        pendingExtinf = null;
                        continue;
                    }
                    pendingExtinf = null; // 其它标签/注释不绑定到 ts
                }

                // 主目录 = ts 路径众数（贴片通常与正片处于不同目录）
                const dirCount = {};
                let mainDir = '';
                let mainDirCount = -1;
                for (const e of tsEntries) {
                    dirCount[e.dir] = (dirCount[e.dir] || 0) + 1;
                    if (dirCount[e.dir] > mainDirCount) {
                        mainDirCount = dirCount[e.dir];
                        mainDir = e.dir;
                    }
                }
                const firstTsNum = tsEntries.length ? extractTsNumber(tsEntries[0].url) : null;

                let changed = false;
                let adCount = 0;
                for (const e of tsEntries) {
                    let isAd = false;
                    const reason = [];
                    // 1) 目录与正片主目录不同（换源贴片）
                    if (e.dir && mainDir && e.dir !== mainDir) { isAd = true; reason.push('dir'); }
                    // 2) URL 命中广告关键词
                    const low = e.url.toLowerCase();
                    if (AD_KEYWORDS.some(k => low.includes(k))) { isAd = true; reason.push('kw'); }
                    // 3) 序号跳变（保留原逻辑）
                    const num = extractTsNumber(e.url);
                    if (num !== null && (num > 100000 || (firstTsNum !== null && num - firstTsNum > relativeThreshold))) { isAd = true; reason.push('seq'); }
                    e.isAd = isAd;
                    if (isAd) { changed = true; adCount++; console.log('[广告过滤] 过滤广告 ts:', e.url, '原因:', reason.join(',')); }
                }

                // 第二遍：按原始顺序重建，剔除广告 ts 及对应 EXTINF，并清理悬挂的 DISCONTINUITY
                const tsIndexByLine = {};
                for (const e of tsEntries) tsIndexByLine[e.origIndex] = e;

                const raw = [];
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.startsWith('#EXTINF')) {
                        // 找到紧随其后的 ts 行（跳过 BYTERANGE 等中间标签）
                        let j = i + 1;
                        while (j < lines.length && lines[j].startsWith('#') && !/\.ts/i.test(lines[j])) j++;
                        if (j < lines.length && /\.ts/i.test(lines[j]) && !lines[j].startsWith('#')) {
                            const entry = tsIndexByLine[j];
                            if (entry && entry.isAd) { i = j; continue; } // 跳过广告 ts 及其 EXTINF
                            raw.push(line);
                            for (let k = i + 1; k < j; k++) raw.push(lines[k]);
                            raw.push(resolveTsUrl(lines[j]));
                            i = j;
                            continue;
                        }
                        raw.push(line);
                        continue;
                    }
                    if (/\.ts/i.test(line) && !line.startsWith('#')) {
                        const entry = tsIndexByLine[i];
                        if (entry && entry.isAd) continue;
                        raw.push(resolveTsUrl(line));
                        continue;
                    }
                    if (line.startsWith('#EXT-X-DISCONTINUITY')) {
                        raw.push(line);
                        continue;
                    }
                    raw.push(line);
                }

                // DISCONTINUITY 仅保留位于两个保留 ts 之间的；贴片整块被剔除后产生的悬挂项删除
                const isTsLine = (l) => typeof l === 'string' && /\.ts($|\?)/i.test(l);
                const prevTs = (arr, k) => { for (let m = k - 1; m >= 0; m--) { if (isTsLine(arr[m])) return true; if (arr[m].startsWith('#EXTINF')) continue; if (arr[m].startsWith('#EXT-X-DISCONTINUITY')) continue; } return false; };
                const nextTs = (arr, k) => { for (let m = k + 1; m < arr.length; m++) { if (isTsLine(arr[m])) return true; if (arr[m].startsWith('#EXTINF')) continue; if (arr[m].startsWith('#EXT-X-DISCONTINUITY')) continue; } return false; };

                const filtered = [];
                for (let k = 0; k < raw.length; k++) {
                    const cur = raw[k];
                    if (cur.startsWith('#EXT-X-DISCONTINUITY')) {
                        if (prevTs(raw, k) && nextTs(raw, k)) filtered.push(cur);
                        else { changed = true; console.log('[广告过滤] 移除悬挂 DISCONTINUITY'); }
                        continue;
                    }
                    filtered.push(cur);
                }

                console.log('[广告过滤] 广告 ts 数量:', adCount, '是否变化:', changed);
                if (!changed) return m3u8Url;

                const blob = new Blob([filtered.join('\n')], { type: 'application/x-mpegURL' });
                const blobUrl = URL.createObjectURL(blob);
                console.log('[广告过滤] 返回 blob URL:', blobUrl);
                return blobUrl;
            } catch (e) {
                console.error('[广告过滤] 失败:', e);
                return m3u8Url;
            }
        }

        // 暴露到全局，方便控制台测试
        window.extractTsNumber = extractTsNumber;
        window.filterAdTsFromM3u8 = filterAdTsFromM3u8;
        window.filterM3u8Ads = filterAdTsFromM3u8;

        // 控制台直接传入 m3u8 文本进行测试
        window.testFilterM3u8Ads = function(m3u8Text, relativeThreshold = 10000) {
            const lines = m3u8Text.split('\n');
            const filtered = [];
            let adCount = 0;
            let firstTsNum = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.startsWith('#EXTINF')) {
                    filtered.push(line);
                    continue;
                }

                if (/\.ts/i.test(line)) {
                    const num = extractTsNumber(line);
                    console.log('[测试过滤] ts 行:', line, '提取数字:', num);
                    if (firstTsNum === null) firstTsNum = num;

                    if (num !== null && firstTsNum !== null && num - firstTsNum > relativeThreshold) {
                        adCount++;
                        console.log('[测试过滤] 过滤广告 ts:', line, '基准:', firstTsNum, '差值:', num - firstTsNum);
                        if (filtered.length > 0 && filtered[filtered.length - 1].startsWith('#EXTINF')) {
                            filtered.pop();
                        }
                        continue;
                    }
                    filtered.push(line);
                    continue;
                }

                filtered.push(line);
            }

            console.log('[测试过滤] 广告数量:', adCount);
            console.log('[测试过滤] 结果:\n' + filtered.join('\n'));
            return filtered.join('\n');
        };

        // 同时绑定 click 与 touchstart，防止移动端 300ms 延迟及重复触发
        function addTapListener(el, handler) {
            if (!el || typeof handler !== 'function') return;
            let lastTouchTime = 0;
            const onTouch = (e) => {
                lastTouchTime = Date.now();
                e.preventDefault();
                handler(e);
            };
            const onClick = (e) => {
                if (Date.now() - lastTouchTime < 500) {
                    e.preventDefault();
                    return;
                }
                handler(e);
            };
            el.addEventListener('touchstart', onTouch, { passive: false });
            el.addEventListener('click', onClick);
        }

        // ===== 播放器全局键盘快捷键 =====
        // 根因：<video controls> 的原生快捷键只在 video 获焦时生效；点击自定义控制栏/页面其它元素后
        // 焦点被夺走，空格/方向键失灵。这里在 document 捕获阶段统一拦截，无论焦点在哪都能控制当前视频；
        // 输入框/搜索框内不拦截，保证正常输入。preventDefault 同时抑制原生 media 默认动作，避免双击。
        function togglePlayerFullscreen(el) {
            try {
                const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
                if (!fsEl) { if (fn) fn.call(el); }
                else if (exitFn) { exitFn.call(document); }
            } catch (e) {}
        }

        function bindPlayerHotkeys() {
            if (window.__playerHotkeysBound) return;
            window.__playerHotkeysBound = true;
            document.addEventListener('keydown', function(e) {
                const ae = document.activeElement;
                if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
                const v = document.getElementById('mainVideo');
                if (!v) return;
                const vp = document.getElementById('videoPlayer');
                if (!vp || vp.style.display === 'none') return;
                const k = e.key;
                let handled = true;
                switch (k) {
                    case ' ':
                    case 'Spacebar':
                    case 'k':
                    case 'K':
                        if (v.paused) v.play().catch(function() {}); else v.pause();
                        break;
                    case 'ArrowLeft':
                    case 'j':
                    case 'J':
                        v.currentTime = Math.max(0, v.currentTime - 5);
                        break;
                    case 'ArrowRight':
                    case 'l':
                    case 'L':
                        if (v.duration && isFinite(v.duration)) v.currentTime = Math.min(v.duration, v.currentTime + 5);
                        else v.currentTime = v.currentTime + 5;
                        break;
                    case 'ArrowUp':
                        v.muted = false;
                        v.volume = Math.min(1, (v.volume || 0) + 0.1);
                        break;
                    case 'ArrowDown':
                        v.volume = Math.max(0, (v.volume || 0) - 0.1);
                        break;
                    case 'm':
                    case 'M':
                        v.muted = !v.muted;
                        break;
                    case 'f':
                    case 'F':
                        togglePlayerFullscreen(v);
                        break;
                    case 'Home':
                        v.currentTime = 0;
                        break;
                    case 'End':
                        if (v.duration && isFinite(v.duration)) v.currentTime = v.duration;
                        break;
                    default:
                        handled = false;
                }
                if (handled) { e.preventDefault(); e.stopPropagation(); }
            }, true);
        }

        async function playVideo(url, serverIndex, episodeIndex, isAutoRetry = false) {
            const canUse = await checkUserAccess();
            if (!canUse) {
                showLoginRequired();
                return;
            }

            // 绑定一次全局播放快捷键（焦点不在 video 上也能用）
            bindPlayerHotkeys();

            const videoPlayer = document.getElementById('videoPlayer');

            // 记录当前播放位置
            currentServerIndex = serverIndex;
            currentEpisodeIndex = episodeIndex;
            currentEpisodeUrl = url || '';
            if (!isAutoRetry) {
                currentPlayAttemptServers = new Set();
                hasAutoRetriedCurrentEpisode = false;
            }

            // 高亮当前选中的剧集
            document.querySelectorAll('.play-list li').forEach(item => item.classList.remove('active'));
            const sections = document.querySelectorAll('.server-section');
            let episodeTitle = '';
            if (sections[serverIndex]) {
                const items = sections[serverIndex].querySelectorAll('.play-list li');
                if (items[episodeIndex]) {
                    items[episodeIndex].classList.add('active');
                    items[episodeIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    episodeTitle = items[episodeIndex].getAttribute('data-title') || '';
                }
            }

            // 更新顶部播放信息
            const episodeNameEl = document.getElementById('playingEpisodeName');
            if (episodeNameEl) {
                episodeNameEl.textContent = episodeTitle ? ` · ${episodeTitle}` : '';
            }

            // 记录到播放历史
            addToHistory();

            // 确保声音解锁处理器已注册（兼容快速进入播放页的情况）
            addGlobalUnmuteHandler();

            if (!url) {
                videoPlayer.innerHTML = '<div class="placeholder">暂无播放地址</div>';
                return;
            }

            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            // 先停止旧视频，避免替换 DOM 时触发 play() 中断报错
            const oldVideo = videoPlayer.querySelector('video');
            if (oldVideo) {
                oldVideo.pause();
                oldVideo.src = '';
                oldVideo.load();
            }

            videoPlayer.innerHTML = '<div class="placeholder">加载中...</div>';

            const isM3u8 = url.includes('.m3u8');
            const isDirectVideo = url.includes('.mp4') || url.includes('.flv') || url.includes('.mkv') || isM3u8;

            if (isDirectVideo) {
                let playUrl = isLocalPreview() ? url : getProxyUrl(url);

                if (isM3u8) {
                    // 先过滤广告 ts，避免播放中因广告分片失效或跳转而中断
                    videoPlayer.innerHTML = '<div class="placeholder">正在解析播放地址...</div>';
                    playUrl = await filterAdTsFromM3u8(playUrl);

                    videoPlayer.innerHTML = `
                        <video id="mainVideo" controls playsinline style="width:100%;height:100%;border-radius:8px;background:#000;">

                    attachVideoRecoveryEvents(video, videoPlayer);

                    // 尽早注册错误监听，避免加载过程中出错未被捕获
                    video.addEventListener('error', function() {
                        // 忽略已被切换或清理的旧播放器错误

                        const errInfo = video.error ? { code: video.error.code, message: video.error.message } : null;

                        // 播放中的网络错误先尝试原地恢复（reload + 续播），避免直接重建播放器（hls.js 由自身错误处理接管）
                        if (video.error && video.error.code === 2 && video.currentTime > 0 && !video._inPlaceRetryDone && !currentHls) {
                            video._inPlaceRetryDone = true;
                            const lastTime = video.currentTime;
                            console.warn('播放中网络错误，尝试原地恢复', errInfo);
                            const onLoaded = () => {
                                video.currentTime = lastTime;
                                tryPlayVideo(video);
                                video.removeEventListener('loadedmetadata', onLoaded);
                            };
                            video.addEventListener('loadedmetadata', onLoaded);
                            video.load();
                            return;
                        }

                        console.warn('Video error, triggering fallback/retry', errInfo);

                    video.addEventListener('ended', onVideoEnded);

                                enableWorker: true,
                                lowInitialPlaylist: false,

                                stretchShortVideoTrack: false,

                                maxMaxBufferLength: 180,

                            currentHls = hls;
                            hls.loadSource(playUrl);

                            let recoverTime = 0;
                            let lastKnownTime = 0;
                            let seekAttempts = 0;
                            const MAX_SEEK_ATTEMPTS = 10;
                            let mediaErrorRecoverCount = 0;
                            const MAX_MEDIA_ERROR_RECOVER = 2;
                            let networkErrorRecoverCount = 0;
                            const MAX_NETWORK_ERROR_RECOVER = 2;

                            function tryRestorePosition() {
                                if (recoverTime > 0 && video) {
                                    // 不打断正在正常播放的画面
                                    if (!video.paused) return;
                                    // 接近片尾的恢复点会导致“播完即重头播放”，直接放弃
                                    const dur = (video.duration && isFinite(video.duration)) ? video.duration : Infinity;
                                    if (recoverTime >= dur - 1) {
                                        console.log('[HLS 恢复] 恢复点接近片尾，放弃恢复避免重头播放:', recoverTime, '片长:', dur);
                                        recoverTime = 0;
                                        seekAttempts = 0;
                                        return;
                                    }
                                    if (Math.abs(video.currentTime - recoverTime) > 1) {
                                        video.currentTime = recoverTime;
                                        seekAttempts++;
                                        console.log('[HLS 恢复] 尝试恢复到:', recoverTime, '当前:', video.currentTime, '第', seekAttempts, '次');
                                        if (seekAttempts >= MAX_SEEK_ATTEMPTS) {
                                            console.log('[HLS 恢复] 达到最大尝试次数，放弃恢复');
                                            recoverTime = 0;
                                            seekAttempts = 0;
                                        }
                                    } else {
                                        console.log('[HLS 恢复] 恢复成功:', video.currentTime);
                                        recoverTime = 0;
                                        seekAttempts = 0;
                                    }
                                }
                            }

                            video.addEventListener('timeupdate', () => {
                                if (video && video.currentTime > 0) {
                                    lastKnownTime = video.currentTime;
                                    lastTime = video.currentTime;
                                }
                            });

                            hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
                                // manifest 解析完成，开始播放
                                console.log('Manifest parsed, levels:', data.levels ? data.levels.length : 0);
                                tryPlayVideo(video);
                                tryRestorePosition();
                            });

                            hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, function(event, data) {
                                console.log('音频轨道切换:', data);
                                // 若发生非预期音频轨道切换，尝试切回默认轨道
                                if (hls.audioTracks && hls.audioTracks.length > 1 && hls.audioTrack !== 0) {
                                    hls.audioTrack = 0;
                                }
                            });

                            hls.on(Hls.Events.MEDIA_ATTACHED, function() {

                            });

                            video.addEventListener('loadedmetadata', tryRestorePosition);
                            video.addEventListener('canplay', tryRestorePosition);
                            video.addEventListener('playing', tryRestorePosition);

                            hls.on(Hls.Events.ERROR, function(event, data) {
                                console.error('HLS Error:', data);
                                if (data.fatal) {
                                    switch(data.type) {
                                        case Hls.ErrorTypes.MEDIA_ERROR:
                                            // 记录断点用于恢复，但钳制到片尾前 2 秒，避免恢复到末尾引发“重头播放/重复片段”
                                            let rt = lastKnownTime || (video ? (video.currentTime || 0) : 0);
                                            if (video && video.duration && isFinite(video.duration) && rt > video.duration - 2) {
                                                rt = video.duration - 2;
                                            }
                                            recoverTime = rt;
                                            seekAttempts = 0;
                                            mediaErrorRecoverCount++;
                                            console.log('[HLS 恢复] 媒体错误，记录播放位置:', recoverTime, '第', mediaErrorRecoverCount, '次');
                                            if (mediaErrorRecoverCount > MAX_MEDIA_ERROR_RECOVER) {
                                                console.error('[HLS 恢复] 媒体错误恢复次数超限，切换线路');
                                                hls.destroy();
                                                currentHls = null;
                                                handlePlayFailure(videoPlayer);
                                            } else {
                                                hls.recoverMediaError();
                                                setTimeout(() => {
                                                    if (currentHls === hls) hls.startLoad();
                                                }, 200);
                                            }
                                            break;
                                        case Hls.ErrorTypes.NETWORK_ERROR:
                                            // 网络错误多为瞬时抖动，先在当前线路原地重试加载，避免过早切换线路
                                            networkErrorRecoverCount++;
                                            if (networkErrorRecoverCount <= MAX_NETWORK_ERROR_RECOVER) {
                                                console.warn('[HLS 恢复] 网络错误，原地重试加载，第', networkErrorRecoverCount, '次');
                                                setTimeout(() => {
                                                    if (currentHls === hls) { try { hls.startLoad(); } catch (e) {} }
                                                }, 800);
                                            } else {
                                                console.error('HLS 网络错误恢复超限，尝试切换线路');
                                                handlePlayFailure(videoPlayer);
                                            }
                                            break;
                                        default:
                                            hls.destroy();
                                            handlePlayFailure(videoPlayer);
                                            break;
                                    }
                                }
                            });

                            // 画面停滞看门狗：最小化/后台过久或长时间播放后，可能出现“有声无画”
                            // （音频继续走、视频帧停止刷新，恢复前台后解码器未重新同步）。
                            // 仅前台检测，避免后台渲染节流误判；分级恢复：轻推 seek -> recoverMediaError -> 切线路。
                            let stallChecks = 0;
                            let stallNudges = 0;
                            let lastFrameCount = -1;
                            let lastCurrentTime = -1;
                            const MAX_STALL_NUDGES = 4;

                            function totalVideoFrames() {
                                try {
                                    if (video.getVideoPlaybackQuality) return video.getVideoPlaybackQuality().totalVideoFrames;
                                    if (typeof video.webkitDecodedFrameCount === 'number') return video.webkitDecodedFrameCount;
                                } catch (e) {}
                                return -1;
                            }

                            function isForeground() {
                                return document.visibilityState === 'visible' && !document.hidden;
                            }

                            const stallWatchdogTimer = setInterval(() => {
                                if (!video || currentHls !== hls) { clearInterval(stallWatchdogTimer); return; }
                                const frames = totalVideoFrames();
                                if (!isForeground() || video.paused || video.ended || frames < 0) {
                                    lastFrameCount = frames;
                                    lastCurrentTime = video.currentTime;
                                    stallChecks = 0;
                                    return;
                                }
                                if (frames !== lastFrameCount || video.currentTime === lastCurrentTime) {
                                    // 帧在刷新（正常）；或时间没走（属缓冲等待，由其它逻辑处理）
                                    stallChecks = 0;
                                    if (stallNudges > 0 && frames !== lastFrameCount) stallNudges = 0;
                                    lastFrameCount = frames;
                                    lastCurrentTime = video.currentTime;
                                    return;
                                }
                                // 前台、时间在走、帧数不变 → 疑似“有声无画”，连续 2 次（约 4 秒）确认后恢复
                                stallChecks++;
                                lastFrameCount = frames;
                                lastCurrentTime = video.currentTime;
                                if (stallChecks < 2) return;
                                stallChecks = 0;
                                stallNudges++;
                                const nearEnd = video.duration && isFinite(video.duration) && video.duration - video.currentTime < 1;
                                console.warn('[画面看门狗] 检测到视频帧停滞，时间在走但帧不动，第', stallNudges, '次恢复, t=', video.currentTime);
                                if (stallNudges >= MAX_STALL_NUDGES) {
                                    console.error('[画面看门狗] 恢复超限，切换线路');
                                    clearInterval(stallWatchdogTimer);
                                    hls.destroy();
                                    currentHls = null;
                                    handlePlayFailure(videoPlayer);
                                } else if (stallNudges >= 3) {
                                    try { hls.recoverMediaError(); } catch (e) {}
                                    setTimeout(() => { if (currentHls === hls) { try { hls.startLoad(); } catch (e) {} } }, 200);
                                } else if (!nearEnd) {
                                    // 轻推 seek 强制解码器重新同步
                                    video.currentTime = video.currentTime + (stallNudges === 1 ? 0.1 : 0.25);
                                }
                            }, 2000);

                            const onVisChange = () => {
                                if (currentHls !== hls) { document.removeEventListener('visibilitychange', onVisChange); return; }
                                if (isForeground()) {
                                    // 回到前台重新采样基线，给解码器一点恢复时间，避免误判
                                    lastFrameCount = totalVideoFrames();
                                    lastCurrentTime = video ? video.currentTime : -1;
                                    stallChecks = 0;
                                }
                            };
                            document.addEventListener('visibilitychange', onVisChange);
                        } catch (error) {
                            console.error('HLS Init Error:', error);
                        }
                    } else {
                        console.error('浏览器不支持 HLS 播放');
                        videoPlayer.innerHTML = '<div class="placeholder">当前浏览器不支持 HLS 播放</div>';
                    }

                } else {
                    // mp4 等直接视频文件，使用原生 video 播放器
                    videoPlayer.innerHTML = `
                        <video id="mainVideo" controls playsinline style="width:100%;height:100%;border-radius:8px;background:#000;">
                            <source src="${playUrl}" type="video/mp4">
                        </video>
                    `;

                    const video = document.getElementById('mainVideo');
                    attachVideoRecoveryEvents(video, videoPlayer);

                    // 尽早注册错误监听，避免加载过程中出错未被捕获
                    video.addEventListener('error', function() {
                        // 忽略已被切换或清理的旧播放器错误
                        if (video !== videoPlayer.querySelector('video')) return;
                        const errInfo = video.error ? { code: video.error.code, message: video.error.message } : null;

                        // 播放中的网络错误先尝试原地恢复（reload + 续播），避免直接重建播放器（hls.js 由自身错误处理接管）
                        if (video.error && video.error.code === 2 && video.currentTime > 0 && !video._inPlaceRetryDone && !currentHls) {
                            video._inPlaceRetryDone = true;
                            const lastTime = video.currentTime;
                            console.warn('播放中网络错误，尝试原地恢复', errInfo);
                            const onLoaded = () => {
                                video.currentTime = lastTime;
                                tryPlayVideo(video);
                                video.removeEventListener('loadedmetadata', onLoaded);
                            };
                            video.addEventListener('loadedmetadata', onLoaded);
                            video.load();
                            return;
                        }

                        console.warn('Video error, triggering fallback/retry', errInfo);
                        handlePlayFailure(videoPlayer);
                    });
                    video.addEventListener('ended', onVideoEnded);
                    tryPlayVideo(video);
                }
            } else {
                // 非直接播放地址（iframe 页面等），不再嵌入，直接尝试切换线路
                console.log('[非直接播放地址] 尝试切换线路:', url);
                handlePlayFailure(videoPlayer);
            }
        }

        // 为 video 绑定卡顿/缓冲/后台切回等自动恢复事件
        function attachVideoRecoveryEvents(video, videoPlayer) {
            if (!video || video._recoveryAttached) return;
            video._recoveryAttached = true;

            let lastTime = 0;
            let stuckTimer = null;
            let wasPausedByUser = false;

            function clearStuckTimer() {
                if (stuckTimer) {
                    clearTimeout(stuckTimer);
                    stuckTimer = null;
                }
            }

            // 起播看门狗：原生 HLS 遇到坏分片/坏源时常常只触发 waiting 而不触发 error，
            // 会一直卡在 0 秒不报错，导致换线路逻辑永远不执行。这里超时后主动兜底换线路。
            let startWatchdog = null;
            function clearStartWatchdog() {
                if (startWatchdog) {
                    clearTimeout(startWatchdog);
                    startWatchdog = null;
                }
            }
            function armStartWatchdog() {
                if (startWatchdog) return; // 已武装则不重复，避免连续 waiting 事件不断重置计时
                startWatchdog = setTimeout(() => {
                    startWatchdog = null;
                    if (video !== videoPlayer.querySelector('video')) return;
                    // 仍在起点、未真正开始播放、且不是用户主动暂停 → 判定当前线路起播失败
                    if (!video.paused && !video.ended && video.currentTime < 0.5 && video.readyState < 3) {
                        console.warn('[播放看门狗] 起播超时(12s)，触发换线路/重试');
                        handlePlayFailure(videoPlayer);
                    }
                }, 12000);
            }

            video.addEventListener('play', () => {
                wasPausedByUser = false;
                clearStuckTimer();
                armStartWatchdog();
            });

            video.addEventListener('playing', () => {
                lastTime = video.currentTime;
                clearStuckTimer();
                clearStartWatchdog();
            });

            video.addEventListener('timeupdate', () => {
                if (video.currentTime > lastTime) {
                    lastTime = video.currentTime;
                    clearStuckTimer();
                    clearStartWatchdog();
                }
            });

            video.addEventListener('pause', () => {
                // 仅当页面可见、未结束、且不是恢复过程中时，才判定为用户主动暂停
                if (!document.hidden && !video.ended && video.currentTime > 0 && video.currentTime < (video.duration || Infinity)) {
                    wasPausedByUser = true;
                }
            });

            video.addEventListener('waiting', () => {
                console.log('[播放缓冲] waiting 事件，当前时间:', video.currentTime);
                lastTime = video.currentTime;
                // 起播阶段卡在 0 秒：武装看门狗，超时未起播则换线路
                if (video.currentTime < 1 && !video.paused && !video.ended) armStartWatchdog();
                if (!video.paused && !video.ended) {
                    setTimeout(() => {
                        if (video.buffered.length > 0) {
                            const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                            const gap = bufferedEnd - video.currentTime;
                            if (gap >= 1) {
                                console.log("[播放缓冲] Buffer available, gap:", gap.toFixed(2));
                                video.play().catch(() => {});
                            }
                        }
                    }, 2000);
                }
            });

            video.addEventListener('stalled', () => {
                console.warn('[播放卡顿] stalled 事件，当前时间:', video.currentTime);
                if (video.paused || video.ended) return;
                clearStuckTimer();
                
                // 立即检查缓冲区
                const checkBuffer = () => {
                    if (video !== videoPlayer.querySelector('video')) return;
                    if (video.paused || video.ended) return;
                    
                    // 检查缓冲区状态
                    if (video.buffered.length > 0) {
                        const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                        const currentTime = video.currentTime;
                        const gap = bufferedEnd - currentTime;
                        
                        console.log('[播放卡顿] Buffer gap:', gap.toFixed(2), 'current:', currentTime.toFixed(2), 'bufferedEnd:', bufferedEnd.toFixed(2));
                        
                        // 缓冲足够，恢复播放
                        if (gap < 2) {
                            console.log('[播放卡顿] Buffer sufficient, resume playback');
                            video.play().catch(() => {});
                        } else if (gap > 10) {
                            // 缓冲区很大，跳转到接近末尾
                            console.log('[播放卡顿] Large buffer gap, seeking to:', bufferedEnd - 0.5);
                            video.currentTime = Math.max(currentTime + 0.1, bufferedEnd - 0.5);
                            setTimeout(() => video.play().catch(() => {}), 100);
                        } else {
                            // 等待更多缓冲
                            console.log('[播放卡顿] Waiting for more buffer...');
                            stuckTimer = setTimeout(checkBuffer, 1000);
                        }
                    } else {
                        console.log('[播放卡顿] No buffer yet, retrying...');
                        stuckTimer = setTimeout(checkBuffer, 1000);
                    }
                };
                
                // 立即执行检查
                checkBuffer();
            });

            // 页面切回前台时，若因系统冻结导致暂停，自动恢复播放
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && video === videoPlayer.querySelector('video')) {
                    if (!video.ended && !wasPausedByUser && video.paused) {
                        console.log('[页面切回] 尝试恢复播放');
                        video.play().catch(() => {});
                    }
                }
            });
        }

        function tryPlayVideo(video) {
            if (!video) return;

            const playPromise = video.play();
            if (playPromise && typeof playPromise.then === 'function') {
                playPromise.then(() => {
                    console.log('视频自动播放成功');
                    addUnmuteOnInteraction(video);
                }).catch(error => {
                    if (error.name === 'AbortError' && error.message && error.message.includes('interrupted')) {
                        // 切换视频时旧 play()  Promise 被中断，属于正常清理过程，不视为错误
                        return;
                    }
                    console.log('自动播放被阻止，等待用户手动播放:', error.name, error.message);
                    // 不再尝试静音播放
                });
            }
        }

        function addUnmuteOnInteraction(video) {
            if (!video || video._unmuteHandlerAdded) return;
            video._unmuteHandlerAdded = true;

            const unmute = () => {
                if (video && video.muted) {
                    video.muted = false;
                    video.volume = 1;
                    console.log('用户交互后恢复声音');
                }
            };

            video.addEventListener('click', unmute, { once: true });
            video.addEventListener('touchstart', unmute, { once: true });
        }

        // 全局交互解锁声音：安卓等浏览器首次交互可能不在 video 上，捕获整个页面
        function addGlobalUnmuteHandler() {
            if (window._globalUnmuteHandlerAdded) return;
            window._globalUnmuteHandlerAdded = true;

            const unmute = () => {
                const video = document.getElementById('mainVideo');
                if (video && video.muted) {
                    video.muted = false;
                    video.volume = 1;
                    console.log('页面交互后恢复声音');
                }
            };

            document.addEventListener('click', unmute);
            document.addEventListener('touchstart', unmute, { passive: true });
        }

        function onVideoEnded() {
            console.log('当前剧集播放结束，尝试播放下一集');
            playNextEpisode();
        }

        function handlePlayFailure(videoPlayer) {
            const movie = moviesCache[currentVodId];
            if (!movie || !movie._playServers) {
                if (videoPlayer) videoPlayer.innerHTML = '<div class="placeholder">播放失败，请尝试其他线路或接口</div>';
                return;
            }

            // 首次失败时先自动重试当前线路一次，很多错误是瞬时的
            if (!hasAutoRetriedCurrentEpisode) {
                hasAutoRetriedCurrentEpisode = true;
                const currentServerUrls = movie._playServers[currentServerIndex];
                if (currentServerUrls) {
                    const episodes = [];
                    currentServerUrls.split('#').forEach((ep, idx) => {
                        if (!ep.trim()) return;
                        const parsed = parseEpisode(ep, idx);
                        if (parsed && parsed.url) episodes.push(parsed);
                    });
                    if (episodes.length > 0 && currentEpisodeIndex < episodes.length) {
                        console.log('[播放失败] 自动重试当前线路');
                        if (videoPlayer) videoPlayer.innerHTML = '<div class="placeholder">加载失败，正在重试...</div>';
                        setTimeout(() => playVideo(episodes[currentEpisodeIndex].url, currentServerIndex, currentEpisodeIndex, true), 600);
                        return;
                    }
                }
            }

            currentPlayAttemptServers.add(currentServerIndex);

            // 尝试当前集数的下一个可用线路
            for (let i = 0; i < movie._playServers.length; i++) {
                if (currentPlayAttemptServers.has(i)) continue;
                const serverUrls = movie._playServers[i];
                if (!serverUrls) continue;
                const episodes = [];
                serverUrls.split('#').forEach((ep, idx) => {
                    if (!ep.trim()) return;
                    const parsed = parseEpisode(ep, idx);
                    if (parsed && parsed.url) episodes.push(parsed);
                });
                if (episodes.length > 0 && currentEpisodeIndex < episodes.length) {
                    console.log('[播放失败] 切换到线路', i, '当前集数');
                    if (videoPlayer) videoPlayer.innerHTML = '<div class="placeholder">当前线路失败，尝试其他线路...</div>';
                    setTimeout(() => playVideo(episodes[currentEpisodeIndex].url, i, currentEpisodeIndex), 500);
                    return;
                }
            }

            // 所有线路都试过了
            console.error('[播放失败] 所有线路均无法播放，显示重试按钮');
            currentPlayAttemptServers.clear();
            if (videoPlayer) {
                if (currentEpisodeUrl) {
                    videoPlayer.innerHTML = `
                        <div class="player-error">
                            <p>当前影片所有线路均无法播放</p>
                            <button class="btn btn-primary player-retry-btn" type="button" aria-label="点击重试">点击重试</button>
                        </div>
                    `;
                    const retryBtn = videoPlayer.querySelector('.player-retry-btn');
                    addTapListener(retryBtn, () => {
                        console.log('[播放重试] 重新播放当前集:', currentEpisodeUrl);
                        playVideo(currentEpisodeUrl, currentServerIndex, currentEpisodeIndex);
                    });
                } else {
                    videoPlayer.innerHTML = '<div class="placeholder">当前影片所有线路均无法播放，请切换接口源后重试</div>';
                }
            }
        }

        function playNextEpisode() {
            const movie = moviesCache[currentVodId];
            if (!movie || !movie._playServers) return;

            const currentServerUrls = movie._playServers[currentServerIndex];
            if (!currentServerUrls) return;

            const currentEpisodes = [];
            currentServerUrls.split('#').forEach((ep, i) => {
                if (!ep.trim()) return;
                const parsed = parseEpisode(ep, i);
                if (parsed && parsed.url) currentEpisodes.push(parsed);
            });

            const nextEpisodeIndex = currentEpisodeIndex + 1;
            if (nextEpisodeIndex < currentEpisodes.length) {
                console.log('播放下一集:', nextEpisodeIndex);
                playVideo(currentEpisodes[nextEpisodeIndex].url, currentServerIndex, nextEpisodeIndex);
            } else {
                console.log('当前线路已播放完毕');
                clearPlaybackState();
            }
        }

        function playPrevEpisode() {
            const movie = moviesCache[currentVodId];
            if (!movie || !movie._playServers) return;

            const currentServerUrls = movie._playServers[currentServerIndex];
            if (!currentServerUrls) return;

            const currentEpisodes = [];
            currentServerUrls.split('#').forEach((ep, i) => {
                if (!ep.trim()) return;
                const parsed = parseEpisode(ep, i);
                if (parsed && parsed.url) currentEpisodes.push(parsed);
            });

            const prevEpisodeIndex = currentEpisodeIndex - 1;
            if (prevEpisodeIndex >= 0) {
                console.log('播放上一集:', prevEpisodeIndex);
                playVideo(currentEpisodes[prevEpisodeIndex].url, currentServerIndex, prevEpisodeIndex);
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function goHome() {
            stopPlayback(true);
            currentVodId = 0;
            currentServerIndex = 0;
            currentEpisodeIndex = 0;
            searchKeyword = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('detailView')?.classList.remove('active');
            document.getElementById('listView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            loadMovies();
        }

        function getPlayHistory() {
            try {
                return JSON.parse(localStorage.getItem('playHistory')) || [];
            } catch (e) {
                return [];
            }
        }

        function savePlayHistory(history) {
            localStorage.setItem('playHistory', JSON.stringify(history.slice(0, 50)));
        }

        function addToHistory() {
            const movie = moviesCache[currentVodId];
            if (!movie) return;

            const episodeNameEl = document.getElementById('playingEpisodeName');
            const episodeTitle = episodeNameEl ? episodeNameEl.textContent.replace(' · ', '') : '';
            const record = {
                vodId: currentVodId,
                vodName: movie.vod_name || '未知影片',
                vodPic: movie.vod_pic || '',
                episodeTitle: episodeTitle,
                serverIndex: currentServerIndex,
                episodeIndex: currentEpisodeIndex,
                timestamp: Date.now()
            };

            let history = getPlayHistory();
            const existIndex = history.findIndex(item => item.vodId === currentVodId);
            if (existIndex !== -1) {
                history.splice(existIndex, 1);
            }
            history.unshift(record);
            savePlayHistory(history);
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const historyActions = document.getElementById('historyActions');
            const history = getPlayHistory();

            if (history.length === 0) {
                historyList.innerHTML = '<li class="history-empty">暂无播放记录</li>';
                historyActions.style.display = 'none';
                return;
            }

            historyActions.style.display = 'flex';
            historyList.innerHTML = history.map((item, index) => `
                <li class="history-item" onclick="playFromHistory(${index})">
                    <img src="${item.vodPic ? getProxyUrl(item.vodPic) : ''}" alt="" loading="lazy" onerror="this.style.display='none'">
                    <div class="history-item-info">
                        <div class="history-item-title">${escapeHtml(item.vodName)}</div>
                        ${item.episodeTitle ? `<div class="history-item-episode">${escapeHtml(item.episodeTitle)}</div>` : ''}
                        <div class="history-item-time">${formatTime(item.timestamp)}</div>
                    </div>
                </li>
            `).join('');
        }

        function playFromHistory(index) {
            const history = getPlayHistory();
            const item = history[index];
            if (!item) return;

            closeModal('historyModal');
            showDetail(item.vodId).then(() => {
                const movie = moviesCache[item.vodId];
                if (!movie || !movie._playServers) return;
                const serverUrls = movie._playServers[item.serverIndex];
                if (!serverUrls) return;
                const episodes = [];
                serverUrls.split('#').forEach((ep, i) => {
                    if (!ep.trim()) return;
                    const parsed = parseEpisode(ep, i);
                    if (parsed && parsed.url) episodes.push(parsed);
                });
                if (episodes[item.episodeIndex]) {
                    playVideo(episodes[item.episodeIndex].url, item.serverIndex, item.episodeIndex);
                }
            });
        }

        function clearHistory() {
            if (!confirm('确定要清空所有播放记录吗？')) return;
            localStorage.removeItem('playHistory');
            renderHistory();
        }

        function openHistory() {
            renderHistory();
            openModal('historyModal');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            return date.toLocaleDateString('zh-CN');
        }


        // 用户登录相关逻辑（使用 IndexedDB 存储，避免 iOS localStorage 丢失）
        const USER_KEY = 'qianxun_user';
        const TOKEN_KEY = 'qianxun_token';
        const TRIAL_START_KEY = 'qianxun_trial_start';
let trialDuration = 60 * 60 * 1000; // 默认1小时，从后台配置加载
        const TRIAL_DURATION = trialDuration; // 从后台配置获取
        let trialTimer = null;
        // 服务器校验节流：登录后一段时间内信任本地状态，避免每次播放都请求后端（降低播放启动延迟与误判掉线）
        let lastServerVerifyTime = 0;
        const SERVER_VERIFY_INTERVAL = 120000; // 2 分钟内不重复向后端校验

        const userDB = {
            db: null,
            init() {
                return new Promise((resolve, reject) => {
                    if (this.db) return resolve(this.db);
                    const request = indexedDB.open('qianxunUserDB', 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve(this.db);
                    };
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('user')) {
                            db.createObjectStore('user');
                        }
                    };
                });
            },
            async get(key) {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('user', 'readonly');
                    const store = tx.objectStore('user');
                    const request = store.get(key);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                });
            },
            async set(key, value) {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('user', 'readwrite');
                    const store = tx.objectStore('user');
                    const request = store.put(value, key);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            },
            async remove(key) {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('user', 'readwrite');
                    const store = tx.objectStore('user');
                    const request = store.delete(key);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve();
                });
            }
        };

        // 内存缓存，避免频繁读 IndexedDB
        let userCache = {
            username: '',
            token: '',
            trialStart: 0
        };

        async function loadUserCache() {
            try {
                let username = await userDB.get(USER_KEY);
                let token = await userDB.get(TOKEN_KEY);
                let trialStart = await userDB.get(TRIAL_START_KEY);

                // 兼容旧版本试用开始时间
                if (!trialStart && localStorage.getItem(TRIAL_START_KEY)) {
                    trialStart = localStorage.getItem(TRIAL_START_KEY);
                    await userDB.set(TRIAL_START_KEY, trialStart);
                    localStorage.removeItem(TRIAL_START_KEY);
                }

                userCache = {
                    username: username || '',
                    token: token || '',
                    trialStart: parseInt(trialStart, 10) || 0
                };
            } catch (e) {
                console.error('加载用户缓存失败:', e);
            }
        }

        function isLoggedIn() {
            return !!(userCache.username && userCache.token);
        }

        function getUserInfo() {
            return { username: userCache.username || '', token: userCache.token || '' };
        }

        async function setUser(username, token) {
            userCache.username = username;
            userCache.token = token;
            await userDB.set(USER_KEY, username);
            await userDB.set(TOKEN_KEY, token);
        }

        async function clearUser() {
            userCache.username = '';
            userCache.token = '';
            userCache.trialStart = 0;
            lastServerVerifyTime = 0;
            await userDB.remove(USER_KEY);
            await userDB.remove(TOKEN_KEY);
            await userDB.remove(TRIAL_START_KEY);
            if (trialTimer) clearTimeout(trialTimer);
        }

        async function verifyUserWithServer() {
            const { username, token } = getUserInfo();
            if (!username || !token) {
                clearUser();
                return false;
            }
            try {
                const res = await fetch('/admin/api.php?action=verifyLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, token })
                });
                const data = await res.json();
                if (data.code !== 0 || !data.valid) {
                    console.log('账号校验失败:', data.msg);
                    clearUser();
                    showLoginRequired();
                    return false;
                }
                return true;
            } catch (e) {
                console.log('账号校验网络错误:', e);
                // 网络错误时不强制清除，避免误杀
                return true;
            }
        }

        async function checkUserAccess(skipServerVerify = false) {
            if (isLoggedIn()) {
                // 首次加载先信任本地状态，避免 iOS 刷新时因网络/接口问题误清登录；
                // 已登录时按 SERVER_VERIFY_INTERVAL 节流，短时间内不重复请求后端校验
                const now = Date.now();
                const needVerify = !skipServerVerify && (now - lastServerVerifyTime > SERVER_VERIFY_INTERVAL);
                if (needVerify) {
                    const valid = await verifyUserWithServer();
                    if (!valid) {
                        showLoginRequired();
                        return false;
                    }
                    lastServerVerifyTime = Date.now();
                }
                console.log('用户已登录');
                return true;
            }

            let trialStart = userCache.trialStart;
            const now = Date.now();

            if (!trialStart) {
                trialStart = now;
                userCache.trialStart = trialStart;
                await userDB.set(TRIAL_START_KEY, trialStart.toString());
                console.log('开始试用计时');
            }

            const elapsed = now - trialStart;
            const remaining = TRIAL_DURATION - elapsed;

            if (remaining <= 0) {
                console.log('试用时间已到');
                showLoginRequired();
                return false;
            }

            console.log('试用剩余:', Math.ceil(remaining / 1000), '秒');
            if (trialTimer) clearTimeout(trialTimer);
            trialTimer = setTimeout(() => {
                showLoginRequired();
            }, remaining);

            return true;
        }

        function showLoginRequired() {
            const modal = document.getElementById('loginRequiredModal');
            if (modal) modal.classList.add('active');
        }

        function renderLoginStatus() {
            const statusEl = document.getElementById('loginStatus');
            const userInfoEl = document.getElementById('userInfoStatus');
            const loginBtn = document.getElementById('loginBtn');
            if (isLoggedIn()) {
                if (loginBtn) loginBtn.textContent = '永久会员';
                if (statusEl) {
                    statusEl.textContent = '当前状态：已登录';
                    statusEl.style.background = 'rgba(46, 125, 50, 0.12)';
                    statusEl.style.color = '#1b5e20';
                }
                if (userInfoEl) {
                    userInfoEl.textContent = `账号：${userCache.username}`;
                    userInfoEl.style.background = 'rgba(46, 125, 50, 0.12)';
                    userInfoEl.style.color = '#1b5e20';
                }
            } else {
                if (loginBtn) loginBtn.textContent = '免费用户';
                const trialStart = userCache.trialStart || Date.now();
                const remaining = Math.max(0, TRIAL_DURATION - (Date.now() - trialStart));
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                if (statusEl) {
                    statusEl.textContent = `当前状态：试用中，剩余 ${minutes} 分 ${seconds.toString().padStart(2, '0')} 秒`;
                    statusEl.style.background = 'rgba(255, 193, 7, 0.15)';
                    statusEl.style.color = '#856404';
                }
                if (userInfoEl) {
                    userInfoEl.textContent = '未登录';
                    userInfoEl.style.background = 'rgba(255, 193, 7, 0.15)';
                    userInfoEl.style.color = '#856404';
                }
            }
        }

        function openSettings() {
            const loginForm = document.getElementById('loginForm');
            const userInfoForm = document.getElementById('userInfoForm');
            if (isLoggedIn()) {
                if (loginForm) loginForm.style.display = 'none';
                if (userInfoForm) userInfoForm.style.display = 'block';
            } else {
                if (loginForm) loginForm.style.display = 'block';
                if (userInfoForm) userInfoForm.style.display = 'none';
            }
            renderLoginStatus();
            openModal('settingsModal');
        }

        async function login() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const username = (usernameInput.value || '').trim();
            const password = passwordInput.value || '';

            if (!username || !password) {
                alert('请输入账号和密码');
                return;
            }

            try {
                const res = await fetch('/admin/api.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.code === 0 && data.token) {
                    await setUser(data.username || username, data.token);
                    lastServerVerifyTime = Date.now(); // 刚登录，短期内无需再次服务器校验
                    await userDB.remove(TRIAL_START_KEY);
                    userCache.trialStart = 0;
                    if (trialTimer) clearTimeout(trialTimer);
                    closeModal('settingsModal');
                    closeModal('loginRequiredModal');
                    usernameInput.value = '';
                    passwordInput.value = '';
                    alert('登录成功，感谢使用！');
                    renderLoginStatus();
                } else {
                    alert(data.msg || '登录失败');
                }
            } catch (e) {
                alert('网络错误，请重试');
            }
        }

        async function logout() {
            await clearUser();
            renderLoginStatus();
            closeModal('settingsModal');
            alert('已退出登录');
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                // 登录提示弹窗禁止点击背景关闭
                if (event.target.id === 'loginRequiredModal') return;
                event.target.classList.remove('active');
            }
        };

        initApis();
    </script>

    <button id="resumePlayBtn" class="resume-play-btn" onclick="resumePlayback()" style="display: none;">
        <span class="resume-play-icon">▶</span>
        <span class="resume-play-text">继续播放</span>
    </button>
