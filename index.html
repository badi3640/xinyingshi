<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2e7d32">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="千寻时光">
    <link rel="manifest" href="manifest.json?v=45">
    <link rel="icon" href="icon.svg?v=45" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg?v=45">
    <title>千寻时光</title>
    <script>
        (function() {
            var d = document.createElement('div');
            d.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;opacity:0;pointer-events:none;';
            d.innerHTML = '<div style="height:0;width:0;"></div><div style="height:0;width:0;"></div>';
            document.documentElement.appendChild(d);
            var supported = d.scrollHeight === 1;
            document.documentElement.removeChild(d);
            if (!supported) {
                document.documentElement.classList.add('no-flex-gap');
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest?v=45"></script>
    <script>
        // 如果 Hls 可用，设定更稳健的默认配置。此脚本安全地在 Hls 脚本之后执行。
        (function(){
            try {
                if (window.Hls && Hls.DefaultConfig) {
                    Object.assign(Hls.DefaultConfig, {
                        enableWorker: true,
                        lowLatencyMode: false,
                        maxBufferLength: 60,
                        maxMaxBufferLength: 600,
                        maxBufferSize: 60 * 1000 * 1000,
                        xhrSetup: function(xhr, url) {
                            try { xhr.withCredentials = false; } catch (e) {}
                        }
                    });
                }
            } catch (e) {
                console.warn('Init Hls default config failed', e);
            }
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: transparent;
            --bg-secondary: rgba(255, 255, 255, 0.78);
            --bg-tertiary: rgba(255, 255, 255, 0.55);
            --accent: #2e7d32;
            --accent-hover: #1b5e20;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #7a7a7a;
            --border: rgba(0, 0, 0, 0.08);
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 40%, #a5d6a7 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(64px + env(safe-area-inset-top));
            background: linear-gradient(180deg, rgba(232,245,233,0.98) 0%, rgba(232,245,233,0.85) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: env(safe-area-inset-top) 2% 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .search-bar {
            flex: 1;
            max-width: 520px;
            margin: 0 2rem;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 2.8rem 0.75rem 1.2rem;
            border: 2px solid rgba(46, 125, 50, 0.45);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.65);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.25s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.08);
        }

        .search-bar input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15), 0 4px 12px rgba(46, 125, 50, 0.12);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar button {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.4rem 0.6rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .btn {
            padding: 0.55rem 1.1rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.25s;
            font-weight: 500;
        }

        .btn-shop {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: #fff;
            border: none;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .main-content { padding-top: calc(64px + env(safe-area-inset-top)); min-height: 100vh; }
        .hero { position: relative; width:100%; height:380px; overflow:hidden; background:var(--bg-secondary); display:block; }
        .hero-bg { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0.7; }
        .hero-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(90deg, rgba(232,245,233,0.95) 0%, rgba(232,245,233,0.7) 45%, rgba(232,245,233,0.15) 100%); }
        .hero-content { position:absolute; bottom:0; left:var(--sidebar-width); padding:2.5rem; max-width:50%; }
        .movie-card{ width:180px; background:rgba(255,255,255,0.75); border-radius:12px; overflow:hidden; }

    </style>
</head>
<body>
    <div class="header">
        <div class="logo">千寻时光</div>
        <div class="search-bar">
            <input placeholder="搜索电影/剧集/演员...">
            <button>搜索</button>
        </div>
        <div class="header-right">
            <div class="header-actions">
                <button class="btn btn-home">首页</button>
                <button class="btn btn-history">历史</button>
                <a class="btn btn-shop" href="#">购买会员</a>
            </div>
        </div>
    </div>

    <main class="main-content">
        <section class="hero active">
            <img class="hero-bg" src="hero.jpg" alt="">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <span class="hero-label">推荐</span>
                <h1 class="hero-title">欢迎使用千寻时光</h1>
                <p class="hero-desc">在这里可以查找并观看你喜欢的视频内容。</p>
                <button class="hero-btn">立即播放</button>
            </div>
        </section>

        <div class="content-layout">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">分类</div>
                    <div class="category-item">电影</div>
                    <div class="category-item">电视剧</div>
                    <div class="category-item">综艺</div>
                </div>
            </aside>

            <section class="content-area">
                <div class="row-section">
                    <div class="row-header"><h2>热门</h2><div class="row-count">共 10 条</div></div>
                    <div class="movie-row">
                        <div class="movie-card">
                            <div class="movie-poster-wrapper">
                                <img class="movie-poster" src="poster1.jpg" alt="">
                                <div class="poster-placeholder"><span>影</span></div>
                            </div>
                            <div class="movie-info"><div class="movie-title">示例电影</div><div class="movie-remarks">简介 ...</div></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('.logo')?.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
        });
    </script>
</body>
</html>
