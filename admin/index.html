<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线路管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: linear-gradient(135deg, #f1f8e9 0%, #dcedc8 100%);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 1.5rem;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1b5e20;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(46, 125, 50, 0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            color: #444;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: #fff;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        input:disabled {
            background: #f5f5f5;
            color: #888;
        }

        .btn {
            padding: 0.6rem 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-primary {
            background: #2e7d32;
            color: #fff;
        }

        .btn-secondary {
            background: rgba(0,0,0,0.05);
            color: #333;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            text-align: left;
        }

        .small {
            font-size: 0.85rem;
            color: #666;
        }

        /* 省略其余样式（保留原样） */
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">千寻时光</div>
        <div class="search-bar">
            <input type="search" placeholder="搜索电影/剧集/演员..." aria-label="搜索">
            <button type="button">搜索</button>
        </div>
        <div class="header-right">
            <div class="header-actions">
                <button class="btn btn-home" type="button">首页</button>
                <button class="btn btn-history" type="button">历史</button>
                <a class="btn btn-shop" href="#" role="button">购买会员</a>
            </div>
        </div>
    </div>

    <main class="main-content" role="main">
        <section class="hero active">
            <img class="hero-bg" src="hero.jpg" alt="千寻时光 推荐图片">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <span class="hero-label">推荐</span>
                <h1 class="hero-title">欢迎使用千寻时光</h1>
                <p class="hero-desc">在这里可以查找并观看你喜欢的视频内容。</p>
                <button class="hero-btn" type="button">立即播放</button>
            </div>
        </section>

        <div class="content-layout">
            <aside class="sidebar" aria-label="侧边导航">
                <div class="sidebar-section">
                    <div class="sidebar-title">分类</div>
                    <div class="category-item">电影</div>
                    <div class="category-item">电视剧</div>
                    <div class="category-item">综艺</div>
                </div>
            </aside>

            <section class="content-area">
                <div class="row-section">
                    <div class="row-header"><h2>热门</h2><div class="row-count">共 10 条</div></div>
                    <div class="movie-row">
                        <div class="movie-card">
                            <div class="movie-poster-wrapper">
                                <img class="movie-poster" src="poster1.jpg" alt="示例电影海报">
                                <div class="poster-placeholder"><span>影</span></div>
                            </div>
                            <div class="movie-info"><div class="movie-title">示例电影</div><div class="movie-remarks">简介 ...</div></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // 简单交互：logo 点击回到顶部
        document.addEventListener('DOMContentLoaded', function() {
            var logo = document.querySelector('.logo');
            if (logo) {
                logo.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
            }
        });
    </script>
</body>
</html>
